[project]
name = "undertale-mod-lib"
version = "0.9.1.2"
description = "import clr; extract all assets of interest"
requires-python = ">=3.13"
dependencies = [
    "pythonnet>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undertale_mod_lib"]

[tool.hatch.build]
artifacts = [
    "src/undertale_mod_lib/_lib/**",
    "src/undertale_mod_lib/typings/**",
    "stubs/**",
]

[tool.hatch.build.targets.wheel.force-include]
"stubs/UndertaleModLib-stubs" = "UndertaleModLib-stubs"
"stubs/Underanalyzer-stubs" = "Underanalyzer-stubs"
"stubs/ImageMagick-stubs" = "ImageMagick-stubs"
"stubs/Microsoft-stubs" = "Microsoft-stubs"
"stubs/System-stubs" = "System-stubs"